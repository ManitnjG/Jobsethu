name: Build Jobsethu Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  issues: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment file
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          chmod +x gradlew

      - name: Create Android debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)"
          test -n "$APK"
          ls -lh "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/Jobsethu-debug.apk

      - name: Upload Jobsethu APK
        uses: actions/upload-artifact@v4
        with:
          name: Jobsethu-debug-apk
          path: apk-output/Jobsethu-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Capture repair diagnostics
        if: failure()
        run: |
          mkdir -p ai-repair
          ./gradlew --no-daemon --console=plain :app:compileDebugKotlin > ai-repair/compile.log 2>&1 || true
          tail -n 500 ai-repair/compile.log > ai-repair/AI_REPAIR_CONTEXT.md || true
          grep -E -i "(^e:|error:|exception|failed|what went wrong|unresolved reference|cannot find|type mismatch)" ai-repair/compile.log | tail -n 250 > ai-repair/errors.txt || true

      - name: Upload repair diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jobsethu-ai-repair-${{ github.run_number }}
          path: ai-repair/
          if-no-files-found: warn
          retention-days: 14

      - name: Create automated repair issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Build repair needed - run ${{ github.run_number }}" --body-file ai-repair/AI_REPAIR_CONTEXT.md || true

      - name: Publish APK to GitHub Release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          TITLE="Jobsethu APK Build ${{ github.run_number }}"
          gh release create "$TAG" apk-output/Jobsethu-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Installable Jobsethu Android APK built automatically from commit ${{ github.sha }}."
